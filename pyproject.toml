[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rag-knowledge-assistant"
version = "0.2.0"
description = "Grounded technical-support RAG assistant with measurable retrieval evaluation."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "langchain-core>=0.3.75,<0.4",
  "langchain-community>=0.3.29,<0.4",
  "langchain-text-splitters>=0.3.11,<0.4",
  "langchain-openai>=0.3.32,<0.4",
  "faiss-cpu>=1.12,<2.0",
  "sentence-transformers>=5.1,<6.0",
  "rank-bm25>=0.2.2,<0.3",
  "streamlit>=1.49,<2.0",
  "httpx>=0.28,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.13,<0.14"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
